name: Build AniZen 2.7v APK

on:
  push:
    branches:
      - master
      - main
      - preview
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build AniZen-2.7v APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Signing Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Decoding SIGNING_KEYSTORE_BASE64 into app/anizen-nova.jks"
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/anizen-nova.jks
            echo "NOVA_KEYSTORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "NOVA_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "NOVA_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Using repository persistent Nova keystore (app/anizen-nova.jks)"
          fi

      - name: Assemble arm64-v8a APK (signed)
        run: ./gradlew assembleDebug -PabiList=arm64-v8a --no-daemon

      - name: Prepare and Verify AniZen-2.7v.apk
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 2 -name 'AniZen-2.7v.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 2 -name '*arm64-v8a*.apk' | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "No arm64-v8a debug APK found in app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Preparing $APK_PATH -> AniZen-2.7v.apk"
          cp "$APK_PATH" AniZen-2.7v.apk
          ls -lh AniZen-2.7v.apk

          BUILD_TOOLS_DIR=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs AniZen-2.7v.apk
          BADGING=$("$BUILD_TOOLS_DIR/aapt2" dump badging AniZen-2.7v.apk)
          echo "$BADGING" | grep -E "package:|sdkVersion|targetSdkVersion|native-code|application:"
          if echo "$BADGING" | grep -qi "testOnly"; then
            echo "ERROR: APK has android:testOnly set!"
            exit 1
          fi
          if ! echo "$BADGING" | grep -q "arm64-v8a"; then
            echo "ERROR: APK is missing arm64-v8a native libraries!"
            exit 1
          fi
          if ! echo "$BADGING" | grep -q "app.anizen.nova"; then
            echo "ERROR: APK package ID is not app.anizen.nova!"
            exit 1
          fi

      - name: Upload AniZen-2.7v Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniZen-2.7v
          path: AniZen-2.7v.apk
          if-no-files-found: error

      - name: Publish GitHub Release (2.7v)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 2.7v
          name: AniZen 2.7v
          body: |
            Automated signed `arm64-v8a` build of **AniZen 2.7v** (`app.anizen.nova`) — installs directly as an in-place update over **AniZen 2.5v** without losing any library data, extensions, or settings.

            ### What's New & Fixed in 2.7v
            - **Anime4K & MPV Renderer Restored to Original 2.5v / Upstream AniZen:**
              - Reverted all `2.6-fix` Anime4K `.glsl` shader, preset, and MPV renderer/decoder modifications back to exact upstream `salmanbappi/AniZen` (`2.5v`), while keeping custom `PlayerActivity.setHttpOptions` header/cookie passthrough for CloudStream and SFTP streams.
            - **CloudStream Extensions Across Global Search, Source Merge, Tracker Import & Backup Restore:**
              - Normalized `CloudStreamAnimeSource.lang` to lowercase ISO-639-1 codes (`ar`, `en`, `all`, etc.) and ensured CloudStream extensions are never hidden by `enabledLanguages` or `ExtensionManager`-only filters in Global Search, Migration / Tracker Import, and Source Merge.
              - Made `CloudStreamAnimeSource.getSearchAnime` fully stateless with automatic fallback to `quickSearch(query)` when `search(query)` returns empty, and ensured `getAnimeDetails` / `getEpisodeList` resolve cleanly for Merged Anime entries.
              - Stabilized `CloudStreamSourceIds` with deterministic hashing on canonical `pluginPackageName:mainApi.name` (with automatic legacy `2.5v` ID resolution so existing library entries and backups upgrade seamlessly) and awaited CloudStream startup readiness in `AndroidSourceManager` and `BackupRestorer`.
            - **Built-in Online Subtitles (OpenSubtitles) & Reliable External Subtitles in Player:**
              - Hardened local external subtitle loading (`.srt`, `.ass`, `.vtt`, `.ssa`) by caching picked SAF files with preserved extensions and immediately selecting them in MPV (`sub-add ... select`) across CloudStream, SFTP, and standard streams.
              - Added **Online Subtitles (OpenSubtitles)** directly inside the player's **Subtitles** sheet with pre-filled `TrackerTitleNormalizer`-cleaned anime titles, episode/season filters, and language chips (**Arabic `ar`**, **English `en`**, **All**). Works out of the box with no API key required, plus optional OpenSubtitles.com API key / account credentials in **Settings → Player → Subtitles**.

            ### Build Info
            - Package ID: `app.anizen.nova` (direct in-place update over `2.5v`)
            - Version: `2.7v`
            - Signing: Persistent Nova keystore (v1 + v2 + v3)
            - ABI: `arm64-v8a`
            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
          files: AniZen-2.7v.apk
          prerelease: false
          make_latest: true
