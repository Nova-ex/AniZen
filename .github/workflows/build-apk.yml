name: Build AniZen 2.5v APK

on:
  push:
    branches:
      - master
      - main
      - preview
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build AniZen-2.5v APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble arm64-v8a Debug APK (signed with persistent Nova keystore)
        run: ./gradlew assembleDebug -PabiList=arm64-v8a --no-daemon

      - name: Prepare and Verify AniZen-2.5v.apk
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 2 -name 'AniZen-2.5v.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 2 -name '*arm64-v8a*.apk' | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "No arm64-v8a debug APK found in app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Preparing $APK_PATH -> AniZen-2.5v.apk"
          cp "$APK_PATH" AniZen-2.5v.apk
          ls -lh AniZen-2.5v.apk

          BUILD_TOOLS_DIR=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs AniZen-2.5v.apk
          BADGING=$("$BUILD_TOOLS_DIR/aapt2" dump badging AniZen-2.5v.apk)
          echo "$BADGING" | grep -E "package:|sdkVersion|targetSdkVersion|native-code|application:"
          if echo "$BADGING" | grep -qi "testOnly"; then
            echo "ERROR: APK has android:testOnly set!"
            exit 1
          fi
          if ! echo "$BADGING" | grep -q "arm64-v8a"; then
            echo "ERROR: APK is missing arm64-v8a native libraries!"
            exit 1
          fi

      - name: Upload AniZen-2.5v Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniZen-2.5v
          path: AniZen-2.5v.apk
          if-no-files-found: error

      - name: Publish GitHub Release (2.5v)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 2.5v
          name: AniZen 2.5v
          body: |
            Automated signed `arm64-v8a` build of **AniZen 2.5v** (`app.anizen.nova`) with CloudStream (`.cs3`) extension support, MPV header/subtitle passthrough, Arabic tracker normalization, and existing SFTP server support.
            - Package ID: `app.anizen.nova` (installs cleanly alongside official AniZen)
            - Signing: Persistent Nova keystore (v1 + v2 + v3) for seamless future updates
            - ABI: `arm64-v8a` (Galaxy S23 Ultra, Galaxy Tab S9 FE+, and all 64-bit ARM devices)
            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
          files: AniZen-2.5v.apk
          prerelease: false
          make_latest: true
