name: Build AniZen 2.5v APK

on:
  push:
    branches:
      - master
      - main
      - preview
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build AniZen-2.5v Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare AniZen-2.5v.apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 2 -name 'AniZen-2.5v.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 2 -name '*universal*.apk' | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 2 -name '*arm64-v8a*.apk' | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 2 -name '*.apk' | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "No debug APK found in app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Preparing $APK_PATH -> AniZen-2.5v.apk"
          cp "$APK_PATH" AniZen-2.5v.apk
          ls -lh AniZen-2.5v.apk

      - name: Upload AniZen-2.5v Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniZen-2.5v
          path: AniZen-2.5v.apk
          if-no-files-found: error

      - name: Publish GitHub Release (2.5v)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 2.5v
          name: AniZen 2.5v
          body: |
            Automated debug build of **AniZen 2.5v** with CloudStream (`.cs3`) extension support, MPV header/subtitle passthrough, Arabic tracker normalization, and existing SFTP server support.
            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
          files: AniZen-2.5v.apk
          prerelease: false
          make_latest: true
