name: Build S23 Ultra APK (arm64-v8a)

on:
  push:
    branches:
      - master
      - preview
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-s23u-apk:
    name: Build arm64-v8a Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck --no-daemon

      - name: Run Detekt
        run: ./gradlew detekt --no-daemon

      - name: Build arm64-v8a Debug APK
        run: ./gradlew assembleDebug -PabiList=arm64-v8a --no-daemon

      - name: Prepare AniZen-S23U-arm64.apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 2 -name '*arm64-v8a*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 2 -name '*.apk' | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Copying $APK_PATH -> AniZen-S23U-arm64.apk"
          cp "$APK_PATH" AniZen-S23U-arm64.apk

      - name: Publish Release (latest-s23u)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-s23u
          name: AniZen S23 Ultra (arm64-v8a)
          body: |
            Automated `arm64-v8a` debug build for Samsung Galaxy S23 Ultra.
            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
          files: AniZen-S23U-arm64.apk
          prerelease: false
          make_latest: true
